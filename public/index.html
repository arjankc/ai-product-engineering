<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Heritage & Architecture Guide</title>
  <style>
    :root { font-family:"Segoe UI",system-ui,sans-serif; color:#172033; background:#f8fafc; }
    body { max-width:42rem; margin:2rem auto; padding:0 1rem; }
    header { border-left:.4rem solid #9a3412; padding-left:1rem; }
    form { display:grid; gap:.75rem; margin-top:1.5rem; }
    textarea,select { width:100%; box-sizing:border-box; padding:.65rem; font:inherit; }
    textarea { min-height:7rem; }
    button { justify-self:start; padding:.6rem 1rem; border:0; background:#9a3412; color:white; font-weight:700; }
    #results { margin-top:1.25rem; padding:1rem; background:white; border:1px solid #dbe2ea; min-height:4rem; white-space:pre-wrap; }
    #sources,.hint { color:#5b6475; } .state-error { color:#b91c1c; }
  </style>
</head>
<body>
  <header><h1>Local Heritage & Architecture Guide</h1><p class="hint">Track 9 starter: grounded answers with visible sources.</p></header>
  <form id="ask-form">
    <label for="mode">Ask about</label>
    <select id="mode">        <option value="sites">Sites & history</option>
        <option value="architecture">Architecture details</option>
        <option value="route">Walking routes</option></select>
    <label for="query">Your question</label>
    <textarea id="query" required placeholder="What should I notice while walking from Patan Durbar Square to the Golden Temple?"></textarea>
    <button type="submit">Submit</button>
  </form>
  <section id="results">Ask a question to see the mock response.</section>
  <p id="sources"></p>
  <script>
    document.getElementById('ask-form').addEventListener('submit',async(event)=>{
      event.preventDefault(); const results=document.getElementById('results'); const sources=document.getElementById('sources');
      results.textContent='Loading…'; sources.textContent='';
      try {
        const response=await fetch('/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:document.getElementById('query').value.trim(),mode:document.getElementById('mode').value})});
        const data=await response.json(); if(!response.ok)throw new Error(data.error||'Request failed');
        results.textContent=data.response||JSON.stringify(data); if(data.sources?.length)sources.textContent='Sources: '+data.sources.join(', ');
      } catch(error) { results.className='state-error'; results.textContent=String(error); }
    });
  </script>
</body>
</html>
