<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Hardware Troubleshooting Bot</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #1c1917;
      --muted: #57534e;
      --card: #fffdf9;
      --accent: #0f766e;
      --accent-ink: #f0fdfa;
      --err: #b91c1c;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    body { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem 3rem; }
    h1 { font-size: 1.75rem; letter-spacing: -0.02em; margin: 0 0 0.35rem; }
    .tagline { color: var(--muted); margin: 0 0 1.5rem; }
    form {
      background: var(--card);
      border: 1px solid #e7e5e4;
      padding: 1.25rem;
      display: grid;
      gap: 0.65rem;
    }
    label { font-size: 0.9rem; font-weight: 600; }
    textarea, select, input[type="file"] { width: 100%; box-sizing: border-box; }
    textarea { min-height: 7rem; padding: 0.65rem; font: inherit; }
    select { min-height: auto; padding: 0.45rem; font: inherit; }
    button {
      justify-self: start;
      margin-top: 0.35rem;
      padding: 0.55rem 1.1rem;
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #results {
      margin-top: 1.25rem;
      padding: 1rem;
      background: var(--card);
      border: 1px solid #e7e5e4;
      min-height: 4.5rem;
      white-space: pre-wrap;
    }
    #sources { color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
    .state-empty { color: #a8a29e; }
    .state-error { color: var(--err); }
    .hint { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Local Hardware Troubleshooting Bot</h1>
  <p class="tagline">Troubleshooting grounded in your device manuals, network map, and known-good fixes.</p>

  <form id="ask-form">
    <label for="mode">Ask about</label>
    <select id="mode" name="mode">
      <option value="devices">Device manuals</option>
      <option value="network">Network & connectivity</option>
      <option value="repairs">Known fixes & safety</option>
    </select>

    <label for="query">Your question</label>
    <textarea id="query" name="query" required placeholder="e.g. Why is the office printer unreachable?"></textarea>

    <label for="image">Optional device / wiring photo (Stretch)</label>
    <input id="image" name="image" type="file" accept="image/*" />
    <p class="hint">Optional: attach a worksheet photo. The assistant explains it using vault notes only.</p>

    <button type="submit" id="submit-btn">Ask (RAG)</button>
    <button type="button" id="tools-btn">Ask with tools</button>
  </form>

  <section id="results" class="state-empty" aria-live="polite">Describe a device problem to search the hardware vault.</section>
  <p id="sources"></p>

  <script>
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || '');
          const comma = result.indexOf(',');
          resolve(comma >= 0 ? result.slice(comma + 1) : result);
        };
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    async function ask(endpoint) {
      const query = document.getElementById('query').value.trim();
      const mode = document.getElementById('mode').value;
      const imageInput = document.getElementById('image');
      const results = document.getElementById('results');
      const sources = document.getElementById('sources');
      const submitBtn = document.getElementById('submit-btn');
      const toolsBtn = document.getElementById('tools-btn');

      results.className = '';
      results.textContent = 'Loading…';
      sources.textContent = '';
      submitBtn.disabled = true;
      toolsBtn.disabled = true;

      try {
        const body = { query, mode };
        if (endpoint === '/query') {
          const file = imageInput.files?.[0];
          if (file) {
            body.base64Image = await fileToBase64(file);
            body.mimeType = file.type || 'image/jpeg';
          }
        }

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          results.className = 'state-error';
          results.textContent = data.error || 'Request failed';
          return;
        }
        results.textContent = data.response || JSON.stringify(data);
        if (Array.isArray(data.sources) && data.sources.length) {
          sources.textContent = 'Sources: ' + data.sources.join(', ');
        }
      } catch (err) {
        results.className = 'state-error';
        results.textContent = String(err);
      } finally {
        submitBtn.disabled = false;
        toolsBtn.disabled = false;
      }
    }

    document.getElementById('ask-form').addEventListener('submit', (event) => {
      event.preventDefault();
      ask('/query');
    });
    document.getElementById('tools-btn').addEventListener('click', () => ask('/tools'));
  </script>
</body>
</html>
