<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Heritage & Architecture Guide</title>
  <style>
    :root { --bg:#f8fafc; --ink:#172033; --muted:#5b6475; --card:#fff; --accent:#9a3412; --error:#b91c1c; font-family:"Segoe UI",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
    body { max-width:46rem; margin:0 auto; padding:2.5rem 1rem 4rem; }
    header { border-left:0.4rem solid var(--accent); padding-left:1rem; margin-bottom:1.5rem; }
    h1 { margin:0 0 .35rem; font-size:clamp(1.8rem,5vw,2.5rem); letter-spacing:-.03em; }
    .tagline,.hint,#sources { color:var(--muted); }
    form,#results { background:var(--card); border:1px solid #dbe2ea; border-radius:.75rem; box-shadow:0 8px 24px #0f172a0d; }
    form { padding:1.25rem; display:grid; gap:.7rem; }
    label { font-weight:650; font-size:.92rem; }
    textarea,select,input[type=file] { width:100%; box-sizing:border-box; font:inherit; }
    textarea { min-height:8rem; padding:.75rem; border:1px solid #b8c2cf; border-radius:.4rem; }
    select { padding:.55rem; border:1px solid #b8c2cf; border-radius:.4rem; }
    button { justify-self:start; padding:.65rem 1.1rem; border:0; border-radius:.4rem; background:var(--accent); color:white; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #results { margin-top:1.25rem; padding:1rem; min-height:5rem; white-space:pre-wrap; }
    #sources { font-size:.9rem; }
    .state-empty { color:#7b8493; } .state-error { color:var(--error); }
  </style>
</head>
<body>
  <header>
    <h1>Local Heritage & Architecture Guide</h1>
    <p class="tagline">Grounded answers from your own vault, with visible sources and honest limits.</p>
  </header>
  <form id="ask-form">
    <label for="mode">Ask about</label>
    <select id="mode" name="mode">
        <option value="sites">Sites & history</option>
        <option value="architecture">Architecture details</option>
        <option value="route">Walking routes</option>
    </select>
    <label for="query">Your question</label>
    <textarea id="query" name="query" required placeholder="What should I notice while walking from Patan Durbar Square to the Golden Temple?"></textarea>
    <label for="image">Optional façade, carving, or streetscape photo (Stretch)</label>
    <input id="image" name="image" type="file" accept="image/*" />
    <p class="hint">Images add visible evidence; answers must still be grounded in the vault.</p>
    <button type="submit" id="submit-btn">Ask with RAG</button>
    <button type="button" id="tools-btn">Ask with tools</button>
  </form>
  <section id="results" class="state-empty" aria-live="polite">Ask a question grounded in the seven-note starter vault.</section>
  <p id="sources"></p>
  <script>
    function fileToBase64(file) {
      return new Promise((resolve,reject) => {
        const reader=new FileReader();
        reader.onload=() => { const value=String(reader.result||''); resolve(value.slice(value.indexOf(',')+1)); };
        reader.onerror=() => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }
    async function ask(endpoint) {
      const query=document.getElementById('query').value.trim();
      const mode=document.getElementById('mode').value;
      const image=document.getElementById('image').files?.[0];
      const results=document.getElementById('results');
      const sources=document.getElementById('sources');
      const submitBtn=document.getElementById('submit-btn');
      const toolsBtn = document.getElementById('tools-btn');
      toolsBtn.disabled = true;
      results.className=''; results.textContent='Loading…'; sources.textContent=''; submitBtn.disabled=true;
      try {
        const body={ query, mode };
        if (endpoint==='/query' && image) { body.base64Image=await fileToBase64(image); body.mimeType=image.type||'image/jpeg'; }
        const response=await fetch(endpoint,{ method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body) });
        const data=await response.json();
        if (!response.ok) { results.className='state-error'; results.textContent=data.error||'Request failed'; return; }
        results.textContent=data.response||JSON.stringify(data);
        if (Array.isArray(data.sources)&&data.sources.length) sources.textContent='Sources: '+data.sources.join(', ');
      } catch (error) { results.className='state-error'; results.textContent=String(error); }
      finally { submitBtn.disabled=false;
        toolsBtn.disabled = false; }
    }
    document.getElementById('ask-form').addEventListener('submit',(event) => { event.preventDefault(); ask('/query'); });
    document.getElementById('tools-btn').addEventListener('click', () => ask('/tools'));
  </script>
</body>
</html>
