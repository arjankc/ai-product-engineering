<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Log & Itinerary Copilot</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #1c1917;
      --muted: #57534e;
      --card: #fffdf9;
      --accent: #0f766e;
      --accent-ink: #f0fdfa;
      --err: #b91c1c;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    body { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem 3rem; }
    h1 { font-size: 1.75rem; letter-spacing: -0.02em; margin: 0 0 0.35rem; }
    .tagline { color: var(--muted); margin: 0 0 1.5rem; }
    form {
      background: var(--card);
      border: 1px solid #e7e5e4;
      padding: 1.25rem;
      display: grid;
      gap: 0.65rem;
    }
    label { font-size: 0.9rem; font-weight: 600; }
    textarea, select, input[type="file"] { width: 100%; box-sizing: border-box; }
    textarea { min-height: 7rem; padding: 0.65rem; font: inherit; }
    select { min-height: auto; padding: 0.45rem; font: inherit; }
    button {
      justify-self: start;
      margin-top: 0.35rem;
      padding: 0.55rem 1.1rem;
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #results {
      margin-top: 1.25rem;
      padding: 1rem;
      background: var(--card);
      border: 1px solid #e7e5e4;
      min-height: 4.5rem;
      white-space: pre-wrap;
    }
    #sources { color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
    .state-empty { color: #a8a29e; }
    .state-error { color: var(--err); }
    .hint { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Travel Log & Itinerary Copilot</h1>
  <p class="tagline">Itineraries grounded in your bookings, budget, preferences, and travel journal.</p>

  <form id="ask-form">
    <label for="mode">Ask about</label>
    <select id="mode" name="mode">
      <option value="itinerary">Itinerary & bookings</option>
      <option value="budget">Budget & currency</option>
      <option value="journal">Places & travel log</option>
    </select>

    <label for="query">Your question</label>
    <textarea id="query" name="query" required placeholder="e.g. What is confirmed for Tuesday in Kathmandu?"></textarea>

    <label for="image">Optional ticket / sign photo (Stretch)</label>
    <input id="image" name="image" type="file" accept="image/*" />
    <p class="hint">Vision is wired in Phase 4. You can attach a file anytime; text-only works from Phase 1.</p>

    <button type="submit" id="submit-btn">Ask</button>
  </form>

  <section id="results" class="state-empty" aria-live="polite">Ask a trip question grounded in the travel vault.</section>
  <p id="sources"></p>

  <script>
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || '');
          const comma = result.indexOf(',');
          resolve(comma >= 0 ? result.slice(comma + 1) : result);
        };
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('ask-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const query = document.getElementById('query').value.trim();
      const mode = document.getElementById('mode').value;
      const imageInput = document.getElementById('image');
      const results = document.getElementById('results');
      const sources = document.getElementById('sources');
      const button = document.getElementById('submit-btn');

      results.className = '';
      results.textContent = 'Loading…';
      sources.textContent = '';
      button.disabled = true;

      try {
        const body = { query, mode };
        const file = imageInput.files?.[0];
        if (file) {
          body.base64Image = await fileToBase64(file);
          body.mimeType = file.type || 'image/jpeg';
        }

        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          results.className = 'state-error';
          results.textContent = data.error || 'Request failed';
          return;
        }
        results.textContent = data.response || JSON.stringify(data);
        if (Array.isArray(data.sources) && data.sources.length) {
          sources.textContent = 'Sources: ' + data.sources.join(', ');
        }
      } catch (err) {
        results.className = 'state-error';
        results.textContent = String(err);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
