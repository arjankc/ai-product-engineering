<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Maintenance & DIY Helper</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; }
    textarea { width: 100%; height: 100px; margin-bottom: 1rem; }
    #output { margin-top: 2rem; padding: 1rem; background: #f0f0f0; border-radius: 8px; white-space: pre-wrap;}
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Home Maintenance & DIY Helper</h1>
  <textarea id="prompt" placeholder="Enter your prompt here..."></textarea>
  <br>
  <button id="submitBtn">Send</button>
  <p id="loading" class="hidden">Loading...</p>
  <div id="output"></div>

  <script>
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const prompt = document.getElementById('prompt').value;
      const output = document.getElementById('output');
      const loading = document.getElementById('loading');
      
      output.innerText = '';
      loading.classList.remove('hidden');

      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        output.innerText = data.response;
      } catch (err) {
        output.innerText = 'Error: ' + err.message;
      } finally {
        loading.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
