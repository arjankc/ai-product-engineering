<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Hardware Troubleshooting Bot</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #111; }
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    textarea, select { width: 100%; min-height: 6rem; }
    select { min-height: auto; margin-bottom: 0.75rem; }
    button { margin-top: 0.75rem; padding: 0.5rem 1rem; }
    #results, #extract-results { margin-top: 1.5rem; padding: 1rem; background: #f4f4f4; min-height: 4rem; white-space: pre-wrap; font-family: ui-monospace, monospace; overflow-x: auto; }
    h2 { font-size: 1.1rem; margin-top: 2rem; }
    hr { margin: 2rem 0 0; border: 0; border-top: 1px solid #ddd; }
    input[type=file] { width: 100%; margin-top: 0.25rem; }
    #sources { color: #555; font-size: 0.9rem; }
    .hint { color: #666; font-size: 0.9rem; }
    .state-empty { color: #888; }
    .state-error { color: #b00020; }
    /* Temperature slider */
    .temp-row { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.75rem; }
    .temp-row label { white-space: nowrap; font-size: 0.9rem; }
    .temp-row input[type=range] { flex: 1; }
    .temp-row output { font-size: 0.9rem; font-variant-numeric: tabular-nums; min-width: 2.5rem; }
    .temp-warning { color: #b00020; font-size: 0.8rem; display: none; }
  </style>
</head>
<body>
  <h1>Local Hardware Troubleshooting Bot</h1>
  <form id="ask-form">
    <label for="mode">Ask about</label>
    <select id="mode" name="mode">
      <option value="devices">Device manuals</option>
      <option value="network">Network &amp; connectivity</option>
      <option value="repairs">Known fixes &amp; safety</option>
    </select>
    <label for="query">Your question</label>
    <textarea id="query" name="query" required></textarea>

    <!-- Lab 7.4 Stretch: temperature slider (prototyping/testing only) -->
    <div class="temp-row">
      <label for="temperature">🌡️ Temperature</label>
      <input type="range" id="temperature" name="temperature"
             min="0" max="2" step="0.1" value="0.3" />
      <output id="temp-display" for="temperature">0.3</output>
    </div>
    <p class="temp-warning" id="temp-warning">
      ⚠️ High temperature (&gt;1.0) may break structured outputs. For testing only.
    </p>

    <button type="submit">Submit</button>
  </form>
  <section id="results" class="state-empty" aria-live="polite">Ask a question to see results.</section>
  <p id="sources"></p>
  <p id="confidence"></p>

  <!-- Session 12 Stretch: vision upload -->
  <hr />
  <h2>Upload an image</h2>
  <form id="upload-form">
    <label for="image">Device label, indicator light, or handwritten note</label>
    <input type="file" id="image" name="image" accept="image/png,image/jpeg,image/webp" required />
    <button type="submit">Extract JSON</button>
    <p class="hint">
      Held in memory and sent to Gemini for extraction; nothing is written to disk.
    </p>
  </form>
  <section id="extract-results" class="state-empty" aria-live="polite">Upload an image to see extracted JSON.</section>
  <p id="extract-meta" class="hint"></p>
  <script>
    // Temperature slider live display + warning
    const slider = document.getElementById('temperature');
    const display = document.getElementById('temp-display');
    const warning = document.getElementById('temp-warning');
    slider.addEventListener('input', () => {
      const val = parseFloat(slider.value).toFixed(1);
      display.textContent = val;
      warning.style.display = parseFloat(val) > 1.0 ? 'block' : 'none';
    });

    document.getElementById('ask-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const query = document.getElementById('query').value.trim();
      const mode = document.getElementById('mode').value;
      const temperature = parseFloat(document.getElementById('temperature').value);
      const results = document.getElementById('results');
      const sources = document.getElementById('sources');
      const confidence = document.getElementById('confidence');
      results.className = '';
      results.textContent = 'Loading…';
      sources.textContent = '';
      confidence.textContent = '';
      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, mode, temperature }),
        });
        const data = await res.json();
        if (!res.ok) {
          results.className = 'state-error';
          results.textContent = data.error || 'Request failed';
          return;
        }
        results.textContent = data.response || JSON.stringify(data);
        if (Array.isArray(data.sources) && data.sources.length) {
          sources.textContent = 'Sources: ' + data.sources.join(', ');
        }
        // Lab 9.4 stretch: show retrieval confidence score
        if (typeof data.topScore === 'number') {
          const pct = (data.topScore * 100).toFixed(1);
          const colour = data.topScore >= 0.7 ? '#2a7a2a' : data.topScore >= 0.5 ? '#b07000' : '#b00020';
          confidence.innerHTML = `Retrieval confidence: <strong style="color:${colour}">${pct}%</strong>`;
        }
      } catch (err) {
        results.className = 'state-error';
        results.textContent = String(err);
      }
    });

    // Session 12 Stretch: upload a photo to POST /extract-image (multipart/form-data).
    // No Content-Type header is set on purpose — the browser adds the multipart boundary.
    document.getElementById('upload-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const out = document.getElementById('extract-results');
      const meta = document.getElementById('extract-meta');
      const file = document.getElementById('image').files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('image', file);

      out.className = '';
      out.textContent = `Extracting ${file.name} (${Math.round(file.size / 1024)} kB)…`;
      meta.textContent = '';

      try {
        const res = await fetch('/extract-image', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) {
          out.className = 'state-error';
          out.textContent = data.error || 'Upload failed';
          if (data.rawText) out.textContent += '\n\nRaw reply:\n' + data.rawText;
          return;
        }
        out.textContent = JSON.stringify(data.data, null, 2);
        meta.textContent = `${data.file.name} · ${(data.file.sizeBytes / 1024).toFixed(1)} kB · `
          + `${data.data.doc_type} · ${data.attempts} model call(s)`;
      } catch (err) {
        out.className = 'state-error';
        out.textContent = String(err);
      }
    });
  </script>
</body>
</html>
